name: Deploy to Elastic Beanstalk
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Create bundle and upload
        run: |
          zip -r app-${{ github.run_number }}.zip application.py requirements.txt
          aws s3 cp app-${{ github.run_number }}.zip s3://ci-artifacts-jessica-2026/eb/
      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name eb-demo-app \
            --version-label v${{ github.run_number }} \
            --source-bundle S3Bucket=ci-artifacts-jessica-2026,S3Key=eb/app-${{ github.run_number }}.zip
      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name eb-demo-env \
            --version-label v${{ github.run_number }}
          aws elasticbeanstalk wait environment-updated --environment-names eb-demo-env
